name: Dependency lock refresh

on:
  workflow_dispatch:
    inputs:
      write_back:
        description: Commit refreshed lock files back to the selected branch
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - name: Refresh pnpm lock
        run: pnpm install --lockfile-only
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
      - name: Refresh Cargo lock
        run: cargo generate-lockfile --manifest-path native/execution-core/Cargo.toml
      - name: Refresh Rust notices
        run: node scripts/devtools/rust-notices.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Python lock
        run: |
          python -m pip install 'uv==0.12.0'
          uv lock --project python/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-dependency-locks
          path: |
            pnpm-lock.yaml
            native/execution-core/Cargo.lock
            python/sdk/uv.lock
            THIRD_PARTY_NOTICES_RUST.md
          if-no-files-found: error
      - name: Commit generated files
        if: ${{ inputs.write_back }}
        shell: bash
        run: |
          git add pnpm-lock.yaml native/execution-core/Cargo.lock python/sdk/uv.lock THIRD_PARTY_NOTICES_RUST.md
          if git diff --cached --quiet; then
            echo 'Generated dependency files already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): refresh generated dependency files'
          git push
