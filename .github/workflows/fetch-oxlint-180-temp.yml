name: Fetch Oxlint 1.80.0 temporary

on:
  push:
    branches:
      - tmp/export-pr33-source

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Build npm-equivalent Oxlint payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/oxlint-npm
          mkdir -p /tmp/oxlint-npm
          cd /tmp/oxlint-npm
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund oxlint@1.80.0 @oxlint/binding-linux-x64-gnu@1.80.0
          node node_modules/oxlint/bin/oxlint --version
          test -f node_modules/@oxlint/binding-linux-x64-gnu/oxlint.linux-x64-gnu.node
          tar -czf /tmp/oxlint-npm-1.80.0.tar.gz node_modules/oxlint node_modules/@oxlint/binding-linux-x64-gnu
          sha256sum /tmp/oxlint-npm-1.80.0.tar.gz > /tmp/oxlint-npm-1.80.0.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: oxlint-npm-1.80.0-linux-x64
          path: |
            /tmp/oxlint-npm-1.80.0.tar.gz
            /tmp/oxlint-npm-1.80.0.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
