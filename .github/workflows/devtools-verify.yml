name: Development toolchain verify

on:
  pull_request:
    paths:
      - 'dev'
      - 'dev.ps1'
      - 'devtools/**'
      - 'scripts/devtools/**'
      - 'package.json'
      - 'rust-toolchain.toml'
      - 'python/sdk/pyproject.toml'
      - '.github/workflows/devtools-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: node scripts/devtools/verify-manifest.mjs
      - run: node scripts/devtools/verify-download-policy.mjs
      - run: node scripts/devtools/dev.mjs doctor --profile minimal
