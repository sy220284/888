name: Project tooling integration audit

on:
  push:
    branches:
      - audit/project-tools-tests

permissions:
  contents: read

jobs:
  integration-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prepare test profile
        shell: bash
        run: sh ./dev setup test
      - name: Verify dependency locks
        shell: bash
        run: sh ./dev deps verify
      - name: Check repository formatting
        shell: bash
        run: sh ./dev format --check
      - name: Run project test profile
        shell: bash
        run: sh ./dev check test
