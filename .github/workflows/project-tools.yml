name: Project tools final audit

on:
  push:
    branches:
      - audit/project-tools-final

permissions:
  contents: read

concurrency:
  group: project-tools-final-audit
  cancel-in-progress: true

env:
  DSH_RUST_VERSION: '1.98.0'
  DSH_PNPM_VERSION: '11.7.0'
  DSH_ACTIONLINT_VERSION: '1.7.12'
  DSH_SHELLCHECK_VERSION: '0.11.0'
  DSH_SHELLCHECK_URL: 'https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz'
  DSH_SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Validate project tool declarations
        shell: bash
        run: |
          node scripts/devtools/verify-manifest.mjs
          node scripts/devtools/verify-download-policy.mjs
          node <<'NODE'
          const fs = require('node:fs')
          const manifest = JSON.parse(fs.readFileSync('devtools/manifest.json', 'utf8'))
          const projectTools = JSON.parse(fs.readFileSync('devtools/project-tools.json', 'utf8'))
          const checks = [
            ['DSH_RUST_VERSION', manifest.tools.rust.version],
            ['DSH_PNPM_VERSION', manifest.tools.pnpm.version],
            ['DSH_ACTIONLINT_VERSION', projectTools.tools.actionlint.version],
            ['DSH_SHELLCHECK_VERSION', projectTools.tools.shellcheck.version],
            ['DSH_SHELLCHECK_URL', projectTools.tools.shellcheck.url],
            ['DSH_SHELLCHECK_SHA256', projectTools.tools.shellcheck.sha256],
          ]
          for (const [name, expected] of checks) {
            if (process.env[name] !== expected) throw new Error(`${name} drift: ${process.env[name]} != ${expected}`)
          }
          NODE
      - name: Install pinned workflow and shell validators
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/project-tools-bin"
          shellcheck_archive="$RUNNER_TEMP/shellcheck-v${DSH_SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 "$DSH_SHELLCHECK_URL" -o "$shellcheck_archive"
          printf '%s  %s\n' "$DSH_SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check --strict -
          tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v${DSH_SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/project-tools-bin/shellcheck"
          GOBIN="$RUNNER_TEMP/project-tools-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${DSH_ACTIONLINT_VERSION}"
          "$RUNNER_TEMP/project-tools-bin/shellcheck" --version | grep -F "version: $DSH_SHELLCHECK_VERSION"
          "$RUNNER_TEMP/project-tools-bin/actionlint" -version | grep -F "$DSH_ACTIONLINT_VERSION"
      - name: Validate shell and workflow syntax
        shell: bash
        run: |
          mapfile -t shell_files < <(git ls-files 'dev' 'scripts/devtools/*.sh')
          if [ "${#shell_files[@]}" -gt 0 ]; then
            "$RUNNER_TEMP/project-tools-bin/shellcheck" "${shell_files[@]}"
          fi
          "$RUNNER_TEMP/project-tools-bin/actionlint"
      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$DSH_RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup override set "$DSH_RUST_VERSION"
      - name: Build portable utility bundle
        run: node scripts/devtools/build-project-tools.mjs .artifacts/project-tools
      - name: Prepare test profile
        shell: bash
        run: sh ./dev setup test
      - name: Verify dependency locks
        shell: bash
        run: sh ./dev deps verify
      - name: Check repository formatting
        shell: bash
        run: sh ./dev format --check
      - name: Run project test profile
        shell: bash
        run: sh ./dev check test
