name: PR33 2.0 docs validation

on:
  push:
    branches:
      - upgrade/2.0-p2b-linux-pty
    paths:
      - "README.md"
      - "README.zh.md"
      - "docs/HARNESS-2.0-UPGRADE-ROADMAP.zh.md"
      - ".github/workflows/pr33-docs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify Markdown links
        run: pnpm run verify-md-links
      - name: Verify Markdown wrapping
        run: pnpm run verify-md-wrap
