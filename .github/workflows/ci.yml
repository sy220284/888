name: Harness 2.0 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Pin Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - run: node scripts/devtools/native-gates.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.12.0'
      - run: uv sync --frozen --project python/sdk
      - run: node scripts/devtools/python-gates.mjs
