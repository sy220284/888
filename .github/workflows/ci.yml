name: Harness 2.0 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      native: ${{ steps.scope.outputs.native }}
      python: ${{ steps.scope.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify change scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            {
              echo "code=true"
              echo "native=true"
              echo "python=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" > /tmp/changed-files

          code=false
          native=false
          python=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue

            case "$path" in
              *.md|docs/*|.agents/notes/*)
                ;;
              *)
                code=true
                ;;
            esac

            case "$path" in
              native/*|scripts/devtools/native-gates.mjs|scripts/devtools/rust-notices.mjs|Cargo.toml|Cargo.lock)
                native=true
                ;;
            esac

            case "$path" in
              python/*|scripts/devtools/python-gates.mjs|pyproject.toml|uv.lock)
                python=true
                ;;
            esac

            case "$path" in
              package.json|pnpm-lock.yaml|.github/workflows/ci.yml)
                native=true
                python=true
                ;;
            esac
          done < /tmp/changed-files

          {
            echo "code=$code"
            echo "native=$native"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"

  typescript-static:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Workspace constraints
        run: pnpm run constraints
      - name: Runtime dependency closure
        run: pnpm run verify-runtime-closure
      - name: Package invariants
        run: pnpm run verify-package-invariants
      - name: Build TypeScript contracts
        run: pnpm run build:lib:host
      - name: Type check
        run: pnpm run typecheck:contracts-ready
      - name: Lint
        run: pnpm run lint:contracts-ready

  typescript-tests:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript contracts
        run: pnpm run build:lib:host
      - name: Unit tests shard ${{ matrix.shard }}/3
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  typescript-build:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Official build
        run: pnpm run build:official
      - name: Package publish validation
        run: pnpm run publint
      - name: NodeNext type exports
        run: pnpm run verify-node-next-types
      - name: Built package invariants
        run: pnpm run verify-built-package-invariants

  typescript:
    if: always()
    needs: [changes, typescript-static, typescript-tests, typescript-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify TypeScript lanes
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          STATIC_RESULT: ${{ needs.typescript-static.result }}
          TEST_RESULT: ${{ needs.typescript-tests.result }}
          BUILD_RESULT: ${{ needs.typescript-build.result }}
        run: |
          set -euo pipefail

          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Change-scope classification failed."
            exit 1
          fi

          if [[ "$CODE" != "true" ]]; then
            echo "Documentation-only change; TypeScript lanes skipped."
            exit 0
          fi

          for result in "$STATIC_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A TypeScript lane did not succeed: $result"
              exit 1
            fi
          done

  native:
    if: needs.changes.outputs.native == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Pin Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - run: node scripts/devtools/native-gates.mjs
      - run: node scripts/devtools/rust-notices.mjs --check

  python:
    if: needs.changes.outputs.python == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.12.0'
      - run: uv sync --frozen --project python/sdk --group test
      - run: node scripts/devtools/python-gates.mjs
