name: Format repository baseline

on:
  push:
    branches:
      - audit/format-baseline

permissions:
  contents: write

concurrency:
  group: format-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prepare all formatting tools
        shell: bash
        run: sh ./dev setup full
      - name: Format tracked repository files
        shell: bash
        run: sh ./dev format --write
      - name: Verify formatter is idempotent
        shell: bash
        run: sh ./dev format --check
      - name: Commit formatted baseline excluding workflow files
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          if git diff --cached --quiet; then
            echo 'No non-workflow formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format repository baseline'
          git push origin HEAD:audit/format-baseline
