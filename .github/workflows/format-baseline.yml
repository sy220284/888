name: Format repository baseline

on:
  push:
    branches:
      - audit/format-baseline

permissions:
  contents: read

concurrency:
  group: format-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Pin Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Prepare all formatting tools
        shell: bash
        run: sh ./dev setup full
      - name: Format tracked repository files
        shell: bash
        run: sh ./dev format --write
      - name: Verify formatter is idempotent
        shell: bash
        run: sh ./dev format --check
      - name: Export formatted patch
        shell: bash
        run: |
          git status --short
          git diff --binary --full-index HEAD > format-baseline.patch
          test -s format-baseline.patch
      - name: Upload formatted patch
        uses: actions/upload-artifact@v4
        with:
          name: format-baseline-patch
          path: format-baseline.patch
          if-no-files-found: error
          retention-days: 1
