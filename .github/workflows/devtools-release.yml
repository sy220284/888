name: Development environment bundles

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Environment profile to package
        required: true
        type: choice
        options: [minimal, test, native, python, full]
        default: test

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Build bootstrap bundle manifest
        shell: bash
        if: runner.os != 'Windows'
        run: |
          node scripts/devtools/bundle-manifest.mjs '${{ inputs.profile }}' ".artifacts/devtools-${{ inputs.profile }}"
          sh scripts/devtools/bootstrap.sh download '${{ inputs.profile }}'
          mkdir -p ".artifacts/devtools-${{ inputs.profile }}/cache"
          cp -R .devtools/cache/. ".artifacts/devtools-${{ inputs.profile }}/cache/"
          node scripts/devtools/checksums.mjs ".artifacts/devtools-${{ inputs.profile }}"
      - name: Build bootstrap bundle manifest
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          node scripts/devtools/bundle-manifest.mjs '${{ inputs.profile }}' ".artifacts/devtools-${{ inputs.profile }}"
          .\scripts\devtools\bootstrap.ps1 download '${{ inputs.profile }}'
          New-Item -ItemType Directory -Force -Path ".artifacts/devtools-${{ inputs.profile }}/cache" | Out-Null
          Copy-Item -Recurse -Force '.devtools/cache/*' ".artifacts/devtools-${{ inputs.profile }}/cache/"
          node scripts/devtools/checksums.mjs ".artifacts/devtools-${{ inputs.profile }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-dev-${{ inputs.profile }}-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/devtools-${{ inputs.profile }}
          if-no-files-found: error
          retention-days: 30
