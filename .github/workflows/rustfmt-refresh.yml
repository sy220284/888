name: Rustfmt refresh

on:
  push:
    branches: [harness-2.0/dev-environment-toolchain]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: harness-2.0/dev-environment-toolchain
      - name: Pin Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - run: cargo fmt --manifest-path native/execution-core/Cargo.toml
      - name: Commit formatting
        run: |
          git add native/execution-core/src
          if git diff --cached --quiet; then
            echo 'Rust formatting already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(native): apply rustfmt'
          git push
