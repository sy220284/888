name: Development environment smoke

on:
  pull_request:
    paths:
      - 'dev'
      - 'dev.ps1'
      - 'devtools/**'
      - 'scripts/devtools/**'
      - 'pnpm-lock.yaml'
      - 'native/execution-core/Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/environment-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap test profile on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/devtools/bootstrap.sh setup test
      - name: Bootstrap test profile on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\devtools\bootstrap.ps1 setup test
      - name: Doctor
        shell: pwsh
        if: runner.os == 'Windows'
        run: node scripts/devtools/dev.mjs doctor --profile test
      - name: Doctor
        if: runner.os != 'Windows'
        run: node scripts/devtools/dev.mjs doctor --profile test
