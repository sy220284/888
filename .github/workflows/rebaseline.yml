name: repository-rebaseline

on:
  push:
    branches:
      - chore/rebaseline-source-test-tools

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/rebaseline.mjs
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - run: git add -A
      - run: git diff --cached --stat
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebaseline repository [rebaseline]"
          git push origin HEAD:chore/rebaseline-source-test-tools
