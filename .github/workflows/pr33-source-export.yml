name: pr33-source-export

on:
  push:
    branches:
      - upgrade/2.0-p2b-linux-pty

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack source
        run: |
          git archive --format=zip --output=pr33-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pr33-source
          path: pr33-source.zip
          if-no-files-found: error
          retention-days: 1
