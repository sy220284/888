name: 应用 Harness 2.0 P0 升级补丁

on:
  push:
    branches:
      - harness-2.0/p0-step-snapshot
    paths:
      - .github/workflows/apply-p0-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 P0 分支
        uses: actions/checkout@v4

      - name: 应用本地 P0 补丁并提交
        shell: bash
        env:
          P0_PATCH_XZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$P0_PATCH_XZ_B64" | base64 -d | xz -d > /tmp/HARNESS_2_P0.patch
          git apply --check /tmp/HARNESS_2_P0.patch
          git apply --index /tmp/HARNESS_2_P0.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "升级(P0): 落地持久 step snapshot 冻结边界"
          git push origin HEAD:harness-2.0/p0-step-snapshot
