name: Temporary offline bundle splitter

on:
  push:
    branches:
      - fix/package-invariants-baseline
    paths:
      - '.github/workflows/offline-bundle-temp.yml'

permissions:
  contents: read
  actions: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download verified full bundle from previous run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p .source .parts
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9715027452/zip" \
            -o .source/full.zip
          unzip -q .source/full.zip -d .source/unpacked
          cd .source/unpacked
          sha256sum -c dsh-local-offline-full-Linux-X64.tar.gz.sha256

      - name: Split bundle below connector download limit
        shell: bash
        run: |
          set -euxo pipefail
          split -b 240M -d -a 2 \
            .source/unpacked/dsh-local-offline-full-Linux-X64.tar.gz \
            .parts/part-
          test "$(find .parts -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 4
          cp .source/unpacked/dsh-local-offline-full-Linux-X64.tar.gz.sha256 .parts/original.sha256
          (cd .parts && sha256sum part-* > parts.sha256)
          ls -lh .parts

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-offline-part-00
          path: .parts/part-00
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-offline-part-01
          path: .parts/part-01
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-offline-part-02
          path: .parts/part-02
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-offline-part-03
          path: .parts/part-03
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-offline-checksums
          path: |
            .parts/original.sha256
            .parts/parts.sha256
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
