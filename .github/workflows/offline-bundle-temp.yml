name: Temporary PowerShell diagnostics

on:
  push:
    branches:
      - fix/package-invariants-baseline
    paths:
      - '.github/workflows/offline-bundle-temp.yml'
      - 'packages/subprocess/subprocess-local/scripts/pwsh-pty-diagnostic.mjs'
      - 'packages/shell/tool-pwsh-persistent/**'
      - 'packages/terminal/terminal-bash/**'

permissions:
  contents: read

jobs:
  pwsh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Probe PowerShell PTY startup modes
        run: node packages/subprocess/subprocess-local/scripts/pwsh-pty-diagnostic.mjs
