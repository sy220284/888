name: Temporary PowerShell diagnostics

on:
  push:
    branches:
      - fix/package-invariants-baseline
    paths:
      - '.github/workflows/offline-bundle-temp.yml'
      - 'packages/shell/tool-pwsh-persistent/**'
      - 'packages/terminal/terminal-bash/**'

permissions:
  contents: read

jobs:
  pwsh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Persistent state in isolation
        run: >-
          pnpm exec vitest run --reporter=verbose --maxWorkers=1
          packages/terminal/terminal-bash/tests/local.spec.ts
          -t 'bootstraps a persistent pwsh'
      - name: UTF-8 pinning in isolation
        run: >-
          pnpm exec vitest run --reporter=verbose --maxWorkers=1
          packages/terminal/terminal-bash/tests/local.spec.ts
          -t 'pins UTF-8 output encoding'
      - name: Loader composition in isolation
        run: >-
          pnpm exec vitest run --reporter=verbose --maxWorkers=1
          packages/shell/tool-pwsh-persistent/tests/loader-composition.spec.ts
