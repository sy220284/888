# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full
# repository-wide gate matrix.
# Install: `node scripts/install-lefthook.mjs` (runs automatically via postinstall).

pre-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-archived-agent-notes.ts

    - name: prettier (staged)
      glob: '*.{md,mdx,json,jsonc,yaml,yml,css,scss,less,html}'
      exclude:
        - '.agents/notes/archived/**'
        - 'native/landlock-run/**'
        - 'vendor/**'
        - 'website/.generated/**'
        - 'THIRD_PARTY_NOTICES.md'
        - 'pnpm-lock.yaml'
      run: node scripts/devtools/format.mjs --only prettier -- {staged_files}
      stage_fixed: true

    - name: python format (staged)
      glob: '*.{py,pyi}'
      run: node scripts/devtools/format.mjs --only python -- {staged_files}
      stage_fixed: true

    - name: shell format (staged)
      glob: '*.{sh,bash}'
      exclude:
        - 'native/landlock-run/**'
        - 'vendor/**'
      run: node scripts/devtools/format.mjs --only shell -- {staged_files}
      stage_fixed: true

    - name: toml format (staged)
      glob: '*.toml'
      exclude:
        - 'native/landlock-run/**'
        - 'vendor/**'
      run: node scripts/devtools/format.mjs --only toml -- {staged_files}
      stage_fixed: true

    - name: lint (staged)
      glob: '*.{ts,tsx,mts,cts,mjs}'
      exclude:
        - 'vendor/*/src/**'
      run: node_modules/.bin/tsx scripts/run-oxlint.ts --config .oxlintrc.staged.json --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: native rustfmt
      glob: 'native/execution-core/**/*.{rs,toml}'
      run: cargo fmt --manifest-path native/execution-core/Cargo.toml -- --check

    - name: development tool declarations
      glob: '{dev,dev.ps1,devtools/**,scripts/devtools/**,package.json,rust-toolchain.toml,python/sdk/pyproject.toml,.prettierrc.json,.prettierignore}'
      run: node scripts/devtools/verify-manifest.mjs && node scripts/devtools/verify-download-policy.mjs

    # Regenerate rather than reject: a dependency edit that forgot the notices
    # would otherwise fail the test lane long after the commit. The glob matches
    # every input the generator reads, including the generator itself and the
    # build-time pin source. Deleting a manifest cannot trigger this job —
    # lefthook only inspects files present on disk — so that one case still
    # falls through to the freshness assertion in the test lane.
    - name: third-party notices (staged)
      glob: '{package.json,*/package.json,*/*/package.json,*/*/*/package.json,*/*/*/*/package.json,pnpm-workspace.yaml,*/*/pnpm-workspace.yaml,pnpm-lock.yaml,native/**/Cargo.toml,native/**/Cargo.lock,vendor/README.md,python/*/pyproject.toml,scripts/gen-third-party-notices.ts,scripts/build-exe-for-python-sdk.ts}'
      run: node_modules/.bin/tsx scripts/gen-third-party-notices.ts && git add THIRD_PARTY_NOTICES.md

    - name: whitespace (staged)
      run: git diff --cached --check

    - name: vendor manifest guard
      run: scripts/check-vendor-manifest.sh

pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      glob: '*.i18n.yaml'
      exclude:
        - '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-translation-pairing.ts --cached {staged_files}

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: node_modules/.bin/tsx scripts/verify-archived-agent-notes.ts

pre-push:
  jobs:
    - name: typecheck
      run: pnpm run typecheck

    - name: dependency locks
      run: node scripts/devtools/verify-locks.mjs

    - name: native gates when available
      run: if command -v cargo >/dev/null 2>&1; then node scripts/devtools/native-gates.mjs; else echo 'cargo unavailable; CI owns native gates'; fi
