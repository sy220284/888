[package]
name = "world888-desktop"
version = "0.1.0"
description = "888 Desktop Tauri Shell"
edition = "2021"

[lib]
name = "world888_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
world888-core = { path = "../../../core" }
